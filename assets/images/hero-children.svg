<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" aria-label="Illustration of children with disabilities engaging joyfully in an inclusive classroom">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F5132"/>
      <stop offset="100%" stop-color="#137C77"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>

  <!-- Warm Sun Rays / Hope Motif -->
  <circle cx="400" cy="120" r="140" fill="url(#sunGrad)" opacity="0.25"/>

  <!-- Classroom / Learning Environment Elements -->
  <rect x="50" y="380" width="700" height="12" rx="6" fill="#FEF3C7" opacity="0.3"/>
  <rect x="120" y="260" width="160" height="120" rx="12" fill="#FFFFFF" opacity="0.15"/>
  <text x="200" y="320" font-family="sans-serif" font-size="36" fill="#FFFFFF" text-anchor="middle" font-weight="bold">A B C 1 2 3</text>

  <!-- Child 1: Girl in Wheelchair raise hand with joy -->
  <g transform="translate(180, 240)">
    <!-- Wheelchair Wheel -->
    <circle cx="60" cy="110" r="45" fill="none" stroke="#FEF3C7" stroke-width="8"/>
    <circle cx="60" cy="110" r="10" fill="#FEF3C7"/>
    <!-- Body & Chair Frame -->
    <path d="M40 40 L60 80 L90 80" stroke="#D97706" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="50" cy="20" r="18" fill="#FCE7F3"/> <!-- Head -->
    <path d="M35 45 Q 50 35 65 45" stroke="#000" stroke-width="3" fill="none"/> <!-- Smile -->
    <path d="M50 38 L25 10" stroke="#FEF3C7" stroke-width="6" stroke-linecap="round"/> <!-- Raised Hand -->
  </g>

  <!-- Child 2: Boy with Braille Reader -->
  <g transform="translate(420, 250)">
    <circle cx="40" cy="25" r="18" fill="#FEF3C7"/>
    <rect x="25" y="45" width="30" height="55" rx="8" fill="#10B981"/>
    <!-- Braille Slate -->
    <rect x="10" y="70" width="60" height="30" rx="4" fill="#FEF3C7"/>
    <circle cx="20" cy="80" r="2" fill="#0F5132"/>
    <circle cx="30" cy="80" r="2" fill="#0F5132"/>
    <circle cx="40" cy="85" r="2" fill="#0F5132"/>
    <circle cx="50" cy="80" r="2" fill="#0F5132"/>
  </g>

  <!-- Child 3: Girl with Hearing Aid receiving applause -->
  <g transform="translate(600, 230)">
    <circle cx="40" cy="25" r="18" fill="#FECDD3"/>
    <rect x="25" y="45" width="30" height="60" rx="8" fill="#D97706"/>
    <!-- Hearing Aid indicator icon -->
    <circle cx="52" cy="22" r="4" fill="#FEF3C7"/>
  </g>

  <!-- Decorative Empowering Banner Label -->
  <rect x="220" y="420" width="360" height="44" rx="22" fill="#FEF3C7"/>
  <text x="400" y="448" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0F5132" text-anchor="middle">
    ✨ Inclusion, Dignity & Unlimited Potential
  </text>
</svg>
